<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Learning Timer Demo</title>
  <style>
    :root { color-scheme: dark; --bg:#080d18; --panel:rgba(17,28,48,.88); --line:rgba(99,165,255,.25); --accent:#36a3ff; --mint:#5ce1c2; --text:#f4f7fb; --muted:#a9b7ca; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,system-ui,Arial,sans-serif; color:var(--text); background:radial-gradient(ellipse at 20% 10%,#12345b 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#073c42 0,transparent 35%),var(--bg); }
    .orb { position:fixed; width:300px; height:300px; border-radius:50%; filter:blur(100px); opacity:.22; pointer-events:none; background:var(--accent); top:-140px; right:-90px }
    main { position:relative; width:min(100%,440px); padding:34px 28px 28px; text-align:center; border:1px solid var(--line); border-radius:28px; background:var(--panel); box-shadow:0 24px 80px #0008; backdrop-filter:blur(18px) }
    .eyebrow { display:inline-flex; gap:8px; align-items:center; padding:8px 13px; border:1px solid var(--line); border-radius:99px; color:var(--mint); font-size:11px; font-weight:800; letter-spacing:1.5px }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 12px var(--mint) }
    h1 { margin:20px 0 8px; font-size:clamp(26px,7vw,34px); letter-spacing:-1px }
    .sub { margin:0 auto 28px; max-width:290px; color:var(--muted); font-size:14px; line-height:1.6 }
    .clock { margin:0 auto 24px; padding:24px 12px; border:1px solid var(--line); border-radius:20px; background:linear-gradient(145deg,#102846,#0b1729); font-size:clamp(52px,15vw,70px); font-weight:850; font-variant-numeric:tabular-nums; letter-spacing:2px; text-shadow:0 0 28px #36a3ff40 }
    .field { display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:20px; color:var(--muted); font-size:13px }
    input { width:86px; padding:10px; border:1px solid var(--line); border-radius:10px; background:#081322; color:var(--text); text-align:center; font:inherit }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px }
    button { min-height:48px; border:1px solid var(--line); border-radius:13px; color:var(--text); background:#14243a; font:700 14px inherit; cursor:pointer; transition:transform .15s,filter .15s }
    button:hover { transform:translateY(-1px); filter:brightness(1.15) }
    button.primary { grid-column:1/-1; border-color:#6cc6ff; background:linear-gradient(110deg,#0876d8,#159dff); box-shadow:0 10px 25px #087fff35 }
    button:focus-visible,input:focus-visible { outline:2px solid var(--mint); outline-offset:3px }
    .status { min-height:22px; margin:18px 0 0; color:var(--mint); font-size:12px }
    footer { margin-top:20px; color:#71839b; font-size:10px; letter-spacing:1.2px; text-transform:uppercase }
    @media(max-width:420px) { main { padding:28px 20px 24px } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important } }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="dot"></span> CODING PRACTICE PROJECT</div>
    <h1>Learning Timer</h1>
    <p class="sub">A simple countdown timer demo built with HTML, CSS and JavaScript.</p>
    <div class="clock" id="clock" role="timer" aria-live="off">05:00</div>
    <label class="field">Set minutes
      <input id="minutes" type="number" min="1" max="180" value="5" inputmode="numeric">
    </label>
    <div class="actions">
      <button class="primary" id="startPause" type="button">Start timer</button>
      <button id="reset" type="button">Reset</button>
      <button id="set" type="button">Apply time</button>
    </div>
    <p class="status" id="status" role="status">Ready when you are.</p>
    <footer>Demo only · No betting or wagering features</footer>
  </main>
  <script>
    const clock = document.querySelector('#clock');
    const minutesInput = document.querySelector('#minutes');
    const startPause = document.querySelector('#startPause');
    const statusText = document.querySelector('#status');
    let remaining = 300;
    let intervalId = null;

    function render() {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      clock.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }
    function stop() {
      if (intervalId !== null) clearInterval(intervalId);
      intervalId = null;
      startPause.textContent = 'Start timer';
    }
    function applyTime() {
      stop();
      const mins = Number(minutesInput.value);
      if (!Number.isInteger(mins) || mins < 1 || mins > 180) {
        statusText.textContent = 'Enter a whole number from 1 to 180.';
        return;
      }
      remaining = mins * 60;
      render();
      statusText.textContent = 'Time updated.';
    }
    startPause.addEventListener('click', () => {
      if (intervalId !== null) {
        stop();
        statusText.textContent = 'Timer paused.';
        return;
      }
      if (remaining <= 0) {
        statusText.textContent = 'Set a new time to start again.';
        return;
      }
      startPause.textContent = 'Pause timer';
      statusText.textContent = 'Timer is running.';
      intervalId = setInterval(() => {
        remaining -= 1;
        render();
        if (remaining <= 0) {
          stop();
          statusText.textContent = 'Time is up!';
        }
      }, 1000);
    });
    document.querySelector('#reset').addEventListener('click', () => {
      stop();
      remaining = Math.max(1, Number(minutesInput.value) || 5) * 60;
      render();
      statusText.textContent = 'Timer reset.';
    });
    document.querySelector('#set').addEventListener('click', applyTime);
    render();
  </script>
</body>
</html>
